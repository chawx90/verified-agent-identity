name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'chawx90'
        required: true
        default: 'chawx90'
      agent_description:
        description: 'chawx90'
        required: true
        default: 'chawx90 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ClawHub
        run: npm install -g clawhub

      - name: Install Verified Agent Identity Skill
        run: clawhub install verified-agent-identity --force

      - name: Install script dependencies
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"chawx90","description":"chawx90 AI Agent"}'
